<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leader Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <div id="nav"></div>
  <h1>Leader board</h1>
  <p class="muted" id="updated">Loading...</p>
  <div id="msg" class="msg" hidden></div>
  <div class="card table-wrap" id="board">
    <table class="big-board">
      <thead><tr><th>Finish</th><th>Rider</th><th>Name</th><th class="num">Bonuses</th><th class="num">Score</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script type="module">
import { sb, $, esc, errorText, showMessage, setupBanner, currentScorer, navBar, wireSignOut } from './lib.js';
setupBanner();

// Signed-in scorers and admins get their page links; everyone else just sees the board
currentScorer().then((who) => {
  if (!who.isScorer) return;
  $('#nav').innerHTML = navBar('leaderboard.html', who);
  wireSignOut();
}).catch(() => { /* board still works without the links */ });

async function load() {
  const { data, error } = await sb.rpc('leaderboard');
  if (error) {
    // P0001 = a rule message from the database (the board is hidden for now), not a failure
    showMessage($('#msg'), errorText(error), error.code === 'P0001' ? 'info' : 'error');
    if (error.code === 'P0001') { $('#board').hidden = true; $('#updated').textContent = ''; }
    return;
  }
  showMessage($('#msg'), '');
  $('#board').hidden = false;
  $('#rows').innerHTML = data.map((r) => `<tr>
    <td>${esc(r.finish)}</td><td>${esc(r.rider_number)}</td><td>${esc(r.name)}</td>
    <td class="num">${esc(r.bonuses_counted)}</td><td class="num"><strong>${esc(Number(r.score))}</strong></td></tr>`).join('');
  $('#updated').textContent = `Updated ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })} - refreshes every 30 seconds`;
}
load();
setInterval(() => { if (!document.hidden) load(); }, 30000);
</script>
</body>
</html>
