<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scorer Review</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <p class="muted">Loading...</p>
</main>
<dialog id="claim-dlg" class="compare" aria-label="Claim"></dialog>

<script type="module">
import { sb, $, esc, fmtTime, errorText, showMessage, setupBanner, currentScorer, renderLogin,
         navBar, wireSignOut, shrinkImage, newId, BUCKET, sortableTable, remember, keep, refPhotoUrl } from './lib.js';
setupBanner();

const app = $('#app');
let tab = 'pending';
let view = remember('review_view', 'cards');   // 'cards' or 'table', remembered on this device
let bonuses = [];
let timer = null;
let tables = {};   // sortable tables for the Table view, one per tab
let shown = {};    // claims on screen by id (with photo links), for the claim dialog
let riders = [];   // for the rider summary picker
let summaryRider = remember('summary_rider', '');

async function start() {
  let who;
  try { who = await currentScorer(); } catch (e) { app.innerHTML = `<div class="msg error">${esc(errorText(e))}</div>`; return; }
  if (!who.session) { renderLogin(app, start); return; }
  if (!who.isScorer) {
    app.innerHTML = `${navBar('scorer.html', who)}<div class="msg error">${esc(who.session.user.email)} is not on the scorer list.
      Ask the organizer to add it.</div>`;
    wireSignOut();
    return;
  }
  app.innerHTML = `${navBar('scorer.html', who)}
    <h1>Review claims</h1>
    <div class="tabs">
      <button type="button" data-tab="pending">Pending <span id="pending-count"></span></button>
      <button type="button" data-tab="decided">Decided</button>
      <button type="button" data-tab="add">Add claim</button>
      <button type="button" data-tab="summary">Rider summary</button>
    </div>
    <div class="row"><input type="search" id="filter" class="grow" placeholder="Filter by rider number or bonus code">
      <div class="tabs view-switch" id="view-switch">
        <button type="button" data-view="cards">Cards</button>
        <button type="button" data-view="table">Table</button>
      </div>
      <button type="button" class="secondary" id="refresh">Refresh</button></div>
    <div id="msg" class="msg" hidden></div>
    <div id="body"></div>
    <div id="table-pending" hidden></div>
    <div id="table-decided" hidden></div>`;
  wireSignOut();
  makeTables();
  app.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; render(); }));
  app.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
    view = b.dataset.view; keep('review_view', view); render();
  }));
  $('#refresh').addEventListener('click', render);
  $('#filter').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 300); });
  const { data } = await sb.from('bonuses').select('code,name,points').order('code');
  bonuses = data || [];
  render();
  // Auto-refresh the queue, but never while a scorer is typing a deny reason (a redraw would wipe it)
  setInterval(() => { if (!document.hidden && tab === 'pending' && !typingReason()) render(); }, 20000);
}

const typingReason = () => $('#claim-dlg').open || [...document.querySelectorAll('[data-reason]')]
  .some((el) => el.value.trim() || el === document.activeElement);

// Table view: one dense row per claim, sortable by any header. Uses the same data-act / data-reason /
// data-open attributes as the cards, so Approve, Deny, Revert and the claim dialog work the same way.
function makeTables() {
  const time = (k) => ({ value: (r) => (r[k] ? new Date(r[k]).getTime() : null), cell: (r) => esc(fmtTime(r[k])) });
  const photo = { key: 'photo', label: 'Photo', nosort: true, cell: (r) => (r.url
    ? `<img class="thumb" src="${esc(r.url)}" data-open="${esc(r.id)}" alt="Photo for ${esc(r.bonus_code)}">`
    : `<span class="muted">${r.bonus_is_combo ? 'combo' : 'none'}</span>`) };
  const rider = { key: 'rider_number', label: 'Rider', num: true };
  const name = { key: 'rider_name', label: 'Name' };
  const bonus = { key: 'bonus_code', label: 'Bonus',
    cell: (r) => `<button type="button" class="link open-claim" data-open="${esc(r.id)}"><span class="bonus-code">${esc(r.bonus_code)}</span> ${esc(r.bonus_name || '')}</button>${r.bonus_is_combo ? ' <span class="muted">(combo)</span>' : ''}` };
  const points = { key: 'points', label: 'Points', num: true, desc: true };
  tables.pending = sortableTable($('#table-pending'), [
    photo,
    { key: 'submitted_at', label: 'Submitted', ...time('submitted_at') },
    rider, name, bonus, points,
    { key: 'submitted_by', label: 'By' },
    { key: 'taken_at', label: 'Photo time', ...time('taken_at') },
    { key: 'note', label: 'Note', cls: 'wrap' },
    { key: 'actions', label: 'Decide', nosort: true, cell: (r) => `<div class="row-actions">
        <button type="button" class="ok" data-act="approved" data-id="${esc(r.id)}">Approve</button>
        <input type="text" placeholder="Reason (rider sees it)" data-reason="${esc(r.id)}" maxlength="500" aria-label="Reason to deny ${esc(r.bonus_code)} for rider ${esc(r.rider_number)}">
        <button type="button" class="danger" data-act="denied" data-id="${esc(r.id)}">Deny</button></div>` },
  ], { sort: { key: 'submitted_at', dir: 'asc' }, store: 'review_sort_pending', empty: 'Nothing waiting. Nice.' });
  tables.decided = sortableTable($('#table-decided'), [
    photo,
    { key: 'decided_at', label: 'Decided', desc: true, ...time('decided_at') },
    { key: 'status', label: 'Status', cell: (r) => `<span class="badge ${esc(r.status)}">${esc(r.status)}</span>` },
    rider, name, bonus, points,
    { key: 'decided_by', label: 'Decided by' },
    { key: 'reason', label: 'Reason', cls: 'wrap' },
    { key: 'submitted_at', label: 'Submitted', ...time('submitted_at') },
    { key: 'actions', label: '', nosort: true, cell: (r) => `<div class="row-actions">
        <button type="button" class="secondary" data-act="pending" data-id="${esc(r.id)}">Revert</button></div>` },
  ], { sort: { key: 'decided_at', dir: 'desc' }, store: 'review_sort_decided', empty: 'No decisions yet.' });
}

function applyFilter(q) {
  const f = $('#filter').value.trim().toUpperCase();
  if (!f) return q;
  if (/^\d+$/.test(f)) return q.eq('rider_number', Number(f));
  return q.ilike('bonus_code', `${f}%`);
}

async function signedUrls(rows) {
  const paths = rows.map((r) => r.photo_path).filter(Boolean);
  if (!paths.length) return {};
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
  return Object.fromEntries((data || []).map((d) => [d.path, d.signedUrl]));
}

async function render() {
  app.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  app.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('active', b.dataset.view === view));
  const { count } = await sb.from('claims').select('id', { count: 'exact', head: true }).eq('status', 'pending');
  $('#pending-count').textContent = count != null ? `(${count})` : '';
  const own = tab === 'add' || tab === 'summary';   // tabs with their own controls
  $('#filter').parentElement.hidden = own;
  const tableMode = view === 'table' && !own;
  // Shows the right container; called once the rows are ready so cards and table never show together
  const showViews = () => {
    app.classList.toggle('wide', tableMode);   // tables get the full screen width on a laptop
    $('#table-pending').hidden = !(tableMode && tab === 'pending');
    $('#table-decided').hidden = !(tableMode && tab === 'decided');
  };
  if (tab === 'add') { showViews(); return renderAdd(); }
  if (tab === 'summary') { showViews(); return renderSummary(); }

  let q = sb.from('claims_detail').select('*');
  q = tab === 'pending'
    ? q.eq('status', 'pending').order('submitted_at', { ascending: true })
    : q.neq('status', 'pending').order('decided_at', { ascending: false }).limit(100);
  const { data, error } = await applyFilter(q);
  if (error) { showMessage($('#msg'), errorText(error), 'error'); return; }
  showMessage($('#msg'), '');
  const urls = await signedUrls(data);
  shown = Object.fromEntries(data.map((c) => [c.id, { ...c, url: urls[c.photo_path], refUrl: refPhotoUrl(c.bonus_ref_photo) }]));
  if (tableMode) {
    // Only one view holds the action inputs at a time, so data-reason lookups stay unique
    $('#body').innerHTML = tab === 'decided' && data.length === 100
      ? '<p class="muted">Showing the latest 100 decisions. Use the filter to find older ones.</p>' : '';
    tables[tab === 'pending' ? 'decided' : 'pending'].set([]);
    tables[tab].set(data.map((c) => ({ ...c, url: urls[c.photo_path] })));
    showViews();
    return;
  }
  tables.pending.set([]); tables.decided.set([]);
  showViews();
  $('#body').innerHTML = data.length ? data.map((c) => claimCard(c, urls[c.photo_path])).join('')
    : `<p class="muted">${tab === 'pending' ? 'Nothing waiting. Nice.' : 'No decisions yet.'}</p>`;
}

function claimCard(c, url) {
  const photo = url
    ? `<img src="${esc(url)}" data-open="${esc(c.id)}" alt="Photo for ${esc(c.bonus_code)}">`
    : `<div class="nophoto">${c.bonus_is_combo ? 'Combo - no photo needed' : 'No photo'}</div>`;
  const decided = decidedLine(c);
  return `<div class="card claim">
    ${photo}
    <div class="stack">
      <div><h2><button type="button" class="link open-claim" data-open="${esc(c.id)}"><span class="bonus-code">${esc(c.bonus_code)}</span> ${esc(c.bonus_name || '')}</button>
        <span class="muted">${esc(c.points)} pts${c.bonus_is_combo ? ' - combo' : ''}</span></h2>
        <p>Rider <strong>${esc(c.rider_number)}</strong> - ${esc(c.rider_name)}</p>
        <p class="muted">Submitted ${esc(fmtTime(c.submitted_at))} by ${esc(c.submitted_by)}
          ${c.taken_at ? `- photo file time ${esc(fmtTime(c.taken_at))}` : ''}</p>
        ${c.note ? `<p>Note: ${esc(c.note)}</p>` : ''}
        ${decided}</div>
      ${claimActions(c)}
    </div></div>`;
}

function decidedLine(c) {
  return c.status !== 'pending'
    ? `<p><span class="badge ${esc(c.status)}">${esc(c.status)}</span> by ${esc(c.decided_by)} at ${esc(fmtTime(c.decided_at))}
       ${c.reason ? `<br><span class="muted">Reason: ${esc(c.reason)}</span>` : ''}</p>` : '';
}

function claimActions(c) {
  return c.status === 'pending'
    ? `<div class="row">
         <button type="button" class="ok" data-act="approved" data-id="${esc(c.id)}">Approve</button>
         <input type="text" class="grow" placeholder="Reason to deny (rider sees it)" data-reason="${esc(c.id)}" maxlength="500">
         <button type="button" class="danger" data-act="denied" data-id="${esc(c.id)}">Deny</button>
       </div>`
    : `<button type="button" class="secondary" data-act="pending" data-id="${esc(c.id)}">Revert to pending</button>`;
}

// Claim dialog: the rider's photo next to the bonus reference photo, with the same decide buttons
function openClaimDialog(id) {
  const c = shown[id];
  if (!c) return;
  const figure = (title, url, none) => `<figure>
      <figcaption>${title}</figcaption>
      ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener"><img src="${esc(url)}" alt="${title} for ${esc(c.bonus_code)}"></a>`
        : `<div class="nophoto">${none}</div>`}</figure>`;
  const dlg = $('#claim-dlg');
  dlg.innerHTML = `<div class="stack">
      <div class="row"><h2 class="grow"><span class="bonus-code">${esc(c.bonus_code)}</span> ${esc(c.bonus_name || '')}
          <span class="muted">${esc(c.points)} pts${c.bonus_is_combo ? ' - combo' : ''}</span></h2>
        <button type="button" class="secondary" id="dlg-close">Close</button></div>
      <p>Rider <strong>${esc(c.rider_number)}</strong> - ${esc(c.rider_name)}
        <span class="muted">- submitted ${esc(fmtTime(c.submitted_at))} by ${esc(c.submitted_by)}
        ${c.taken_at ? `- photo file time ${esc(fmtTime(c.taken_at))}` : ''}</span></p>
      ${c.note ? `<p>Note: ${esc(c.note)}</p>` : ''}
      <div class="compare-photos">
        ${figure('Submitted photo', c.url, c.bonus_is_combo ? 'Combo - no photo needed' : 'No photo')}
        ${figure('Reference photo', c.refUrl, 'No reference photo for this bonus. An admin can add one.')}
      </div>
      ${decidedLine(c)}
      ${claimActions(c)}
    </div>`;
  $('#dlg-close').addEventListener('click', () => dlg.close());
  if (!dlg.open) dlg.showModal();
}

document.addEventListener('click', async (ev) => {
  const o = ev.target.closest('[data-open]');
  if (o) { openClaimDialog(o.dataset.open); return; }
  const b = ev.target.closest('[data-act]');
  if (!b) return;
  const status = b.dataset.act;
  // The reason box next to this button (card, table row or dialog all use the same markup)
  const dlg = $('#claim-dlg');
  const inDialog = dlg.contains(b);
  const reasonEl = (b.closest('dialog, .claim, tr') || document).querySelector(`[data-reason="${b.dataset.id}"]`);
  const reason = reasonEl ? reasonEl.value.trim() : '';
  const say = (text, kind) => {
    if (!inDialog) return showMessage($('#msg'), text, kind);
    let m = $('.msg', dlg);
    if (!m) { m = document.createElement('div'); m.className = 'msg'; dlg.firstElementChild.append(m); }
    showMessage(m, text, kind);
  };
  if (status === 'denied' && !reason) { reasonEl.focus(); say('Enter a reason to deny.', 'warn'); return; }
  b.disabled = true;
  const { error } = await sb.rpc('scorer_decide', { p_claim_id: b.dataset.id, p_status: status, p_reason: reason || null });
  if (error) { say(errorText(error), 'error'); b.disabled = false; return; }
  if (inDialog) dlg.close();
  render();
});

function renderAdd() {
  $('#body').innerHTML = `<div class="card">
    <h2>Add a claim for a rider</h2>
    <p class="muted">For riders who could not submit themselves, penalties, or checkpoint entries.</p>
    <form id="add-form" class="stack">
      <div class="row">
        <input type="number" id="a-rider" class="grow" placeholder="Rider number" required min="1">
        <select id="a-bonus" class="grow" required>
          <option value="">Bonus...</option>
          ${bonuses.map((b) => `<option value="${esc(b.code)}">${esc(b.code)} - ${esc(b.name || '')} (${esc(b.points)})</option>`).join('')}
        </select>
      </div>
      <select id="a-status"><option value="approved">Approve now</option><option value="pending">Add as pending</option></select>
      <input type="text" id="a-note" placeholder="Note (optional)" maxlength="500">
      <input type="file" id="a-photo" accept="image/*">
      <button type="submit">Add claim</button>
    </form>
    <div id="a-msg" class="msg" hidden></div></div>`;
  $('#add-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const m = $('#a-msg');
    try {
      let path = null;
      const f = $('#a-photo').files[0];
      if (f) {
        const img = await shrinkImage(f);
        path = `scorer/${newId()}.${img.ext}`;
        const { error } = await sb.storage.from(BUCKET).upload(path, img.blob, { contentType: img.type });
        if (error) throw error;
      }
      const { error } = await sb.rpc('scorer_add_claim', {
        p_rider_number: Number($('#a-rider').value), p_bonus_code: $('#a-bonus').value,
        p_status: $('#a-status').value, p_note: $('#a-note').value || null, p_photo_path: path,
      });
      if (error) throw error;
      showMessage(m, `Added ${$('#a-bonus').value} for rider ${$('#a-rider').value}.`, 'ok');
      ev.target.reset();
    } catch (e) { showMessage(m, errorText(e), 'error'); }
  });
}

// ---- Rider summary: every claim for one rider in the order sent, with the score. Prints on one
// sheet to hand to the rider at the finish; the check boxes are for ticking items off together.
const STATUS_WORD = { approved: 'Approved', denied: 'Denied', pending: 'Pending' };

async function renderSummary() {
  if (!riders.length) {
    const { data, error } = await sb.from('riders').select('id,rider_number,name').order('rider_number');
    if (error) { showMessage($('#msg'), errorText(error), 'error'); return; }
    riders = data || [];
  }
  const keepPick = $('#sum-rider');
  if (!keepPick) {
    $('#body').innerHTML = `<div class="row no-print">
        <select id="sum-rider" class="grow" aria-label="Rider">
          <option value="">Pick a rider...</option>
          ${riders.map((r) => `<option value="${esc(r.rider_number)}">${esc(r.rider_number)} - ${esc(r.name)}</option>`).join('')}
        </select>
        <button type="button" id="sum-print" disabled>Print</button></div>
      <div id="sum-sheet"></div>`;
    $('#sum-rider').value = summaryRider;
    $('#sum-rider').addEventListener('change', () => { summaryRider = $('#sum-rider').value; keep('summary_rider', summaryRider); renderSummary(); });
    $('#sum-print').addEventListener('click', () => window.print());
  }
  const r = riders.find((x) => String(x.rider_number) === String(summaryRider));
  $('#sum-print').disabled = !r;
  if (!r) { $('#sum-sheet').innerHTML = '<p class="muted">Pick a rider to see their claims and score.</p>'; return; }

  const [claims, score, combos, settings] = await Promise.all([
    sb.from('claims_detail').select('*').eq('rider_id', r.id).order('submitted_at', { ascending: true }),
    sb.from('rider_scores').select('*').eq('rider_id', r.id).maybeSingle(),
    sb.from('approved_effective').select('bonus_code').eq('rider_id', r.id).eq('via_combo', true),
    sb.from('settings').select('event_name').eq('id', 1).maybeSingle(),
  ]);
  const err = claims.error || score.error || combos.error;
  if (err) { showMessage($('#msg'), errorText(err), 'error'); return; }
  showMessage($('#msg'), '');
  if (String(r.rider_number) !== String(summaryRider)) return;   // picked another rider meanwhile

  const byCode = Object.fromEntries(bonuses.map((b) => [b.code, b]));
  const rows = claims.data.map((c, i) => ({
    n: i + 1, when: fmtTime(c.submitted_at), code: c.bonus_code, name: c.bonus_name, points: c.points,
    status: c.status, word: STATUS_WORD[c.status] || c.status, reason: c.status === 'denied' ? c.reason : '',
  }));
  // Combos that count because every part is approved have no claim of their own: list them last
  for (const k of (combos.data || []).map((x) => x.bonus_code).sort()) {
    rows.push({ n: rows.length + 1, when: '', code: k, name: byCode[k]?.name, points: byCode[k]?.points,
      status: 'approved', word: 'Counted (all parts approved)', reason: '' });
  }
  const sc = score.data || { score: 0, base_points: 0, worst_penalty: null };
  const pending = rows.filter((x) => x.status === 'pending').length;
  $('#sum-sheet').innerHTML = `<div class="card summary-sheet">
      <div class="row"><div class="grow">
          <h2>${esc(settings.data?.event_name || 'Rally')} - rider summary</h2>
          <p>Rider <strong>${esc(r.rider_number)}</strong> - ${esc(r.name)}</p>
          <p class="muted">Printed ${esc(fmtTime(new Date().toISOString()))}</p></div>
        <div class="summary-score"><div class="score-total">${esc(Number(sc.score).toLocaleString())}</div>
          <div class="muted">total score</div></div></div>
      ${pending ? `<div class="msg warn">${pending} claim${pending === 1 ? ' is' : 's are'} still pending, so this score may change.</div>` : ''}
      <div class="table-wrap"><table class="summary">
        <thead><tr><th class="tick">Check</th><th class="num">#</th><th>Sent</th><th>Bonus</th><th class="num">Points</th><th>Result</th></tr></thead>
        <tbody>${rows.map((x) => `<tr class="${esc(x.status)}">
          <td class="tick"><input type="checkbox" aria-label="Check ${esc(x.code)}"></td>
          <td class="num">${x.n}</td><td>${esc(x.when)}</td>
          <td><span class="bonus-code">${esc(x.code)}</span> ${esc(x.name || '')}</td>
          <td class="num">${esc(x.points)}</td>
          <td><span class="badge ${esc(x.status)}">${esc(x.word)}</span>${x.reason ? `<br><span class="muted">${esc(x.reason)}</span>` : ''}</td>
        </tr>`).join('') || '<tr><td colspan="6" class="muted">No claims yet.</td></tr>'}</tbody>
      </table></div>
      <p class="summary-total">Approved points ${esc(Number(sc.base_points).toLocaleString())}${sc.worst_penalty
        ? ` with a ${esc(sc.worst_penalty)}% penalty` : ''} = <strong>${esc(Number(sc.score).toLocaleString())}</strong></p>
      <p class="signature">Rider signature ______________________ &nbsp; Scorer ______________________</p>
    </div>`;
}

start();
</script>
</body>
</html>
