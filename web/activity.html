<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rally Activity</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" class="wide">
  <p class="muted">Loading...</p>
</main>

<script type="module">
import { sb, $, esc, fmtTime, errorText, showMessage, setupBanner, currentScorer, renderLogin,
         navBar, wireSignOut, sortableTable, remember, keep } from './lib.js';
setupBanner();

const app = $('#app');
let tab = remember('activity_tab', 'feed');
let feed, riders, scorers;   // sortable tables
let feedRows = [];

// "5 min ago" for recent times, clock time for older ones
function ago(v) {
  if (!v) return 'never';
  const mins = Math.round((Date.now() - new Date(v).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  if (mins < 6 * 60) return `${Math.floor(mins / 60)} h ${mins % 60} min ago`;
  return fmtTime(v);
}
const timeValue = (k) => (r) => (r[k] ? new Date(r[k]).getTime() : null);
const timeCell = (k) => (r) => `<span title="${esc(fmtTime(r[k]))}">${esc(ago(r[k]))}</span>`;
const who = (actor) => (/^rider \d+$/.test(actor) ? `Rider ${actor.slice(6)}` : actor);
const actionBadge = { submitted: 'pending', approved: 'approved', denied: 'denied', reverted: '' };

async function start() {
  let me;
  try { me = await currentScorer(); } catch (e) { app.innerHTML = `<div class="msg error">${esc(errorText(e))}</div>`; return; }
  if (!me.session) { renderLogin(app, start); return; }
  if (!me.isScorer) {
    app.innerHTML = `${navBar('activity.html')}<div class="msg error">${esc(me.session.user.email)} is not on the scorer list.
      Ask the organizer to add it.</div>`;
    wireSignOut();
    return;
  }
  app.innerHTML = `${navBar('activity.html')}
    <h1>Activity</h1>
    <div class="row"><p class="muted grow" id="updated"></p>
      <button type="button" class="secondary" id="refresh">Refresh</button></div>
    <div class="tiles">
      <div class="tile"><div class="n" id="t-seen"></div><div class="muted">riders opened their link</div></div>
      <div class="tile"><div class="n" id="t-claimed"></div><div class="muted">riders have sent a claim</div></div>
      <div class="tile"><div class="n" id="t-pending"></div><div class="muted">waiting for review</div></div>
      <div class="tile"><div class="n" id="t-last"></div><div class="muted">last rider claim</div></div>
    </div>
    <div class="tabs">
      <button type="button" data-tab="feed">Claim activity</button>
      <button type="button" data-tab="riders">Riders</button>
      <button type="button" data-tab="scorers">Scorers</button>
    </div>
    <div id="msg" class="msg" hidden></div>
    <section data-panel="feed">
      <input type="search" id="feed-filter" placeholder="Filter by rider number, bonus code or scorer">
      <p class="muted">Newest 300 events: rider submissions and scorer decisions.</p>
      <div id="feed"></div>
    </section>
    <section data-panel="riders">
      <p class="muted">Highlighted riders have never opened their link. "Last seen" updates when a rider opens or refreshes their page.</p>
      <div id="riders"></div>
    </section>
    <section data-panel="scorers">
      <p class="muted">Last sign-in comes from Supabase Auth. Scorers stay signed in on a device, so this is the last time they used an email link.</p>
      <div id="scorers"></div>
    </section>`;
  wireSignOut();

  feed = sortableTable($('#feed'), [
    { key: 'at', label: 'Time', desc: true, value: timeValue('at'), cell: timeCell('at') },
    { key: 'actor', label: 'Who', value: (r) => who(r.actor), cell: (r) => esc(who(r.actor)) },
    { key: 'action', label: 'Action', cell: (r) => `<span class="badge ${actionBadge[r.action] || ''}">${esc(r.action)}</span>` },
    { key: 'rider_number', label: 'Rider', num: true },
    { key: 'rider_name', label: 'Name' },
    { key: 'bonus_code', label: 'Bonus', cell: (r) => `<span class="bonus-code">${esc(r.bonus_code)}</span> ${esc(r.bonus_name || '')}` },
    { key: 'points', label: 'Points', num: true, desc: true },
    { key: 'reason', label: 'Reason', cls: 'wrap' },
  ], { sort: { key: 'at', dir: 'desc' }, store: 'activity_sort_feed', empty: 'No claim activity yet.' });

  riders = sortableTable($('#riders'), [
    { key: 'rider_number', label: '#', num: true },
    { key: 'name', label: 'Name' },
    { key: 'last_seen_at', label: 'Last seen', desc: true, value: timeValue('last_seen_at'), cell: timeCell('last_seen_at') },
    { key: 'claims', label: 'Claims', num: true, desc: true, value: (r) => Number(r.claims) },
    { key: 'pending', label: 'Pending', num: true, desc: true, value: (r) => Number(r.pending) },
    { key: 'approved', label: 'Approved', num: true, desc: true, value: (r) => Number(r.approved) },
    { key: 'denied', label: 'Denied', num: true, desc: true, value: (r) => Number(r.denied) },
    { key: 'last_claim_at', label: 'Last claim', desc: true, value: timeValue('last_claim_at'),
      cell: (r) => (r.last_claim_at ? timeCell('last_claim_at')(r) : '') },
    { key: 'score', label: 'Score', num: true, desc: true, value: (r) => Number(r.score), cell: (r) => esc(Number(r.score)) },
  ], { sort: { key: 'rider_number', dir: 'asc' }, store: 'activity_sort_riders', empty: 'Import riders first.',
       rowClass: (r) => (r.last_seen_at ? '' : 'attention') });

  scorers = sortableTable($('#scorers'), [
    { key: 'email', label: 'Email' },
    { key: 'last_sign_in_at', label: 'Last sign-in', desc: true, value: timeValue('last_sign_in_at'), cell: timeCell('last_sign_in_at') },
  ], { sort: { key: 'email', dir: 'asc' }, store: 'activity_sort_scorers', empty: 'No scorers.' });

  app.querySelectorAll('[data-tab]').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab; keep('activity_tab', tab); showTab();
  }));
  $('#refresh').addEventListener('click', load);
  $('#feed-filter').addEventListener('input', drawFeed);
  showTab();
  await load();
  setInterval(() => { if (!document.hidden) load(); }, 30000);
}

function showTab() {
  if (!['feed', 'riders', 'scorers'].includes(tab)) tab = 'feed';
  app.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
  app.querySelectorAll('[data-panel]').forEach((p) => { p.hidden = p.dataset.panel !== tab; });
}

function drawFeed() {
  const f = $('#feed-filter').value.trim().toLowerCase();
  feed.set(!f ? feedRows : feedRows.filter((r) => (/^\d+$/.test(f) ? String(r.rider_number) === f
    : (r.bonus_code || '').toLowerCase().startsWith(f) || (r.actor || '').toLowerCase().includes(f))));
}

async function load() {
  const [ev, rd, sc] = await Promise.all([
    sb.from('claim_activity').select('*').order('at', { ascending: false }).limit(300),
    sb.from('rider_activity').select('*'),
    sb.rpc('scorer_list'),
  ]);
  const err = ev.error || rd.error || sc.error;
  if (err) { showMessage($('#msg'), errorText(err), 'error'); return; }
  showMessage($('#msg'), '');

  feedRows = ev.data;
  drawFeed();
  riders.set(rd.data);
  scorers.set(sc.data);

  const r = rd.data;
  $('#t-seen').textContent = `${r.filter((x) => x.last_seen_at).length} / ${r.length}`;
  $('#t-claimed').textContent = `${r.filter((x) => Number(x.claims) > 0).length} / ${r.length}`;
  $('#t-pending').textContent = r.reduce((n, x) => n + Number(x.pending), 0);
  const last = r.map((x) => x.last_claim_at).filter(Boolean).sort().pop();
  $('#t-last').textContent = last ? ago(last) : '-';
  $('#updated').textContent = `Updated ${fmtTime(new Date())} - refreshes every 30 seconds`;
}

start();
</script>
</body>
</html>
