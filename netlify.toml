# Netlify deploy from GitHub.
# Set SUPABASE_URL and SUPABASE_ANON_KEY in Netlify -> Site configuration -> Environment variables.
# The build writes web/config.js from them; the committed config.js stays on local Supabase values.
[build]
  publish = "web"
  command = "node scripts/write-config.mjs"

# Both values are public by design (the browser needs them; RLS and grants protect the data),
# so writing them into web/config.js is intended. Keep Netlify's secrets scan on for everything else.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"
